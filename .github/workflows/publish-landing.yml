name: Publish landing
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Detects your package manager (bun/pnpm/yarn/npm), installs, and builds.
      - name: Install & build
        env:
          NITRO_PRESET: node-server
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile && PM="bun run"
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile && PM="pnpm run"
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --immutable && PM="yarn"
          else
            npm ci && PM="npm run"
          fi
          $PM build
      - name: Package .output
        run: tar czf artifact.tgz -C .output .
      - name: Publish to Underpass
        run: |
          OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)
          curl -sf -X POST "$INGEST_URL" \
            -H "Authorization: Bearer $OIDC" \
            -F "domain=$DOMAIN" \
            -F "artifact=@artifact.tgz"
        env:
          AUD: https://tenants.underpass.com.co
          INGEST_URL: https://tenants.underpass.com.co/api/landing-sites/ingest
          DOMAIN: www.immersivelive.co
